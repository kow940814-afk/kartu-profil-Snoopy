<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card UI Design</title>
  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
  <!-- Boxicons CSS -->
  <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>
  <div class="profile-card">
    <!-- Profile Image -->
    <div class="image">
      <img src="https://static.wixstatic.com/media/449abe_7b15686b2118476da4a733a7861dd772~mv2.jpg/v1/fill/w_726,h_726,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/sn-color.jpg" alt="Profile Image" class="profile-img" />
    </div>

    <!-- Profile Details -->
    <div class="text-data">
      <span class="name">Snoopy</span>
      <span class="job">Karakter kartun</span>
    </div>

    <!-- Social Icons -->
    <div class="media-buttons">
      <a href="https://www.facebook.com/Snoopy/" style="background: #4267b2" class="link">
        <i class="bx bxl-facebook"></i>
      </a>
      <a href="https://www.instagram.com/snoopygrams?igsh=MTVvM3BoYzRrdXUwMQ==" style="background-image: linear-gradient(#ff9900, #ff0000,#4070f4)" class="link">
        <i class="bx bxl-instagram"></i>
      </a>
      <a href="https://youtube.com/@snoopy?feature=shared" style="background: #ff0000" class="link">
        <i class="bx bxl-youtube"></i>
      </a>
    </div>

    <!-- Subscribe and Message Buttons -->
    <div class="buttons">
      <button class="button" style="background: #ff0000">Subscribe</button>
      <button class="button" style="background: #8f00ff">Message</button>
    </div>

    <!-- Analytics -->
    <div class="analytics">
      <div class="data">
        <i class="bx bx-heart"></i>
        <span class="number">355jt</span>
      </div>
    </div>
  </div>
</body>

</html>
